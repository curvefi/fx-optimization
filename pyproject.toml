[project]
name = "curve-fx-optimization"
version = "0.1.0"
description = "Curve FX grid execution, analysis, and plotting tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "curve_fx_harness_client",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "orjson>=3.10.0",
    "scipy>=1.11.0",
]

[project.scripts]
fxopt = "fxopt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curve_fx_sim", "src/fxopt"]

[tool.uv.sources]
curve_fx_harness_client = { path = "../curve-fx-arb-harness/python", editable = true }

[dependency-groups]
cluster = [
    "click>=8.1.0",
    "numpy>=1.26.0",
    "orjson>=3.10.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
]
