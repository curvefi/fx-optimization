# Native pool mechanics, with no compiled policy. Keep this grid broad; use
# the dual-EMA manifest after a native region is understood.
[run]
id = "btcusd-native-discovery-f64"
evaluator = "../../../curve-fx-arb-harness/build/native/arb_evaluator_f64"
template = "../templates/btcusd-g1088.json"
batch_size = 256
workers = 1
metric_fields = [
  "apy_net", "apy_net_robust_90d", "avg_rel_price_diff",
  "max_7d_rel_price_diff", "detach_energy_ungated", "trades",
  "n_rebalances", "elapsed_ms",
]

[session]
n_candles = 0
start_time = 1704066924
end_time = 0
candle_filter = 99.0
min_swap = 0.000001
max_swap = 1.0
dustswap_freq_s = 3600
user_swap_freq_s = 0
user_swap_size_frac = 0.01
user_swap_thresh = 0.05
enable_slippage_probes = false
event_cursor = "exact_skip"
metric_profile = "grid_core"

[scenario]
id = "btcusd-native-discovery"
market = "../../data/market/btcusd/candles-2024-2026-08-29-filtered.json"
yb_mode = "off"

[candidate.defaults]
policy_params = []
pool = { A = 50000 }

[candidate.axes]
flat_fee = { values = [0.005, 0.01, 0.015, 0.02, 0.03], targets = ["pool.mid_fee", "pool.out_fee"] }
"pool.donation_apy" = [0.0, 0.005, 0.01, 0.02]
"pool.reserved_profit_fraction" = [0.2, 0.3, 0.4]
