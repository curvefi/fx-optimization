# Single-blade cadence benchmark: 25,600 fees x four RPF values.
# Raw 1-minute ETH/USD candles, native fee/recentering, no reports or YB.
# Dense fee sampling is for sustained throughput and paired data comparisons.
[run]
id = "ethusd-candle-1m-flat-rpf-102400-f64-20260915"
evaluator = "../../../curve-fx-arb-harness/build/baseline-cadence-20260915/arb_evaluator_f64"
template = "../templates/ethusd-native-fresh-10m.json"
batch_size = 512
workers = 128
metric_fields = [
  "vp", "lp_xcp_profit", "apy", "apy_net", "apy_net_robust_90d",
  "avg_rel_price_diff", "max_rel_price_diff", "max_7d_rel_price_diff",
  "final_rel_price_diff", "detach_energy_ungated", "avg_imbalance",
  "trades", "n_rebalances", "total_notional_coin0", "lp_fee_coin0",
  "arb_pnl_coin0", "arb_guarded_loss_coin0", "donations",
  "donation_coin0_total", "tvl_growth", "elapsed_ms",
]

[placement]
hosts = ["blade-a5"]
numa_nodes = [0, 1]

[session]
n_candles = 0
# First 2024 candle's constructed event is five seconds before its timestamp.
# Align initialization with that event; the selected candles still begin Jan 1.
start_time = 1704067195
end_time = 1787650985
# The raw input's largest excursion is <10%, so this 99% guard clips no rows.
candle_filter = 99.0
event_mode = "candle_path"
actor_timing_mode = "legacy_event"
min_swap = 0.000001
max_swap = 1.0
dustswap_freq_s = 0
user_swap_freq_s = 0
enable_slippage_probes = false
event_cursor = "scalar"
metric_profile = "full_summary"

[scenario]
id = "ethusd-raw-1m-2024-20260825-yb-off"
market = "../../../data/market/candles/ethusd/candles-2023-2026-08-25-raw.json"
yb_mode = "off"

[candidate.defaults]
policy_params = []
pool = { A = 50000, ma_time = 600, donation_apy = 0.01 }

[candidate.axes]
flat_fee = { start = 0.0001, stop = 0.03, count = 25600, scale = "log", targets = ["pool.mid_fee", "pool.out_fee"] }
"pool.reserved_profit_fraction" = [0.2, 0.3, 0.4, 0.5]
