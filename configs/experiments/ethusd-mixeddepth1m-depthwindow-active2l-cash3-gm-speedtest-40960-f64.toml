# Linear baseline grid: 64 fees x 64 donation APYs x 10 RPF values = 40,960 pools.
# Finite ETH/USDT depth every 60s with the baseline candle execution through gaps.
# Calendar-matched window: 2024-02-15 through 2026-08-20; four-mode cadence speed comparison.
[run]
id = "ethusd-mixeddepth1m-depthwindow-active2l-cash3-gm-speedtest-40960-f64-20260915"
evaluator = "../../../curve-fx-arb-harness/build/mixed-depth-speedtest-20260915/arb_evaluator_f64"
template = "../templates/ethusd-native-fresh-10m.json"
batch_size = 1024
workers = 128
metric_fields = ["apy", "apy_net", "apy_net_robust_90d", "arb_guarded_loss_coin0", "avg_imbalance", "avg_rel_price_diff", "detach_energy_ungated", "donation_coin0_total", "donations", "elapsed_ms", "final_rel_price_diff", "lp_xcp_profit", "max_7d_rel_price_diff", "max_rel_price_diff", "n_rebalances", "trades", "tvl_growth", "vp", "yb_apy", "yb_apy_gm", "yb_final_growth", "yb_releverage_trades"]

[placement]
hosts = ["blade-a5", "blade-a3", "blade-a4", "blade-a6", "blade-a7", "blade-a8", "blade-a10", "blade-b3", "blade-b4", "blade-b5", "blade-b6", "blade-b7", "blade-b8", "blade-b9", "blade-b10"]
numa_nodes = []

[session]
n_candles = 0
# First selected candle's constructed event is five seconds before its timestamp.
# Align candle initialization with that event; depth starts at its first publication.
start_time = 1707955195
end_time = 1787270345
# Fresh depth uses the regular clock; uncovered events use the raw candle path.
candle_filter = 99.0
event_mode = "mixed_depth"
observation_interval_s = 60
cex_depth_max_age_s = 60
actor_timing_mode = "legacy_event"
yb_cash_multiplier = 3.0
yb_releverage_fee = 0.012
min_swap = 0.000001
max_swap = 1.0
dustswap_freq_s = 3600
user_swap_freq_s = 0
enable_slippage_probes = false
event_cursor = "scalar"
metric_profile = "full_summary"

[scenario]
market = "../../../data/market/candles/ethusd/candles-2023-2026-08-25-raw.json"
id = "ethusd-mixeddepth1m-20240215-20260820-yb-active2l"
cex_depth = "../../data/depth/binance-eth-usdt/recovered-1m-16bin-20260915/ETH-USDT-20240215-20260820-1m.npz"
yb_mode = "active_2l"

[candidate.defaults]
policy_params = []
pool = { A = 50000, ma_time = 600 }

[candidate.axes]
flat_fee = { start = 0.001, stop = 0.03, count = 64, scale = "linear", targets = ["pool.mid_fee", "pool.out_fee"] }
"pool.donation_apy" = { start = 0.0, stop = 0.10, count = 64, scale = "linear" }
"pool.reserved_profit_fraction" = { start = 0.2, stop = 0.6, count = 10, scale = "linear" }
