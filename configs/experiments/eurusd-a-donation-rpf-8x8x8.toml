[run]
id = "eurusd-a-donation-rpf-8x8x8"
evaluator = "../../../curve-fx-arb-harness/build/native/arb_evaluator_f64"
template = "../templates/eurusd-2024-monorepo.json"
batch_size = 64
workers = 10
metric_fields = [
  "apy_net_consistency_90d", "detach_energy_ungated",
  "max_7d_rel_price_diff", "avg_imbalance", "trades", "elapsed_ms",
]

[session]
n_candles = 0
start_time = 1704146400
end_time = 0
candle_filter = 99.0
min_swap = 0.000001
max_swap = 1.0
user_swap_freq_s = 3600
user_swap_size_frac = 0.01
user_swap_thresh = 0.05

[scenario]
id = "eurusd-2024-monorepo"
market = "../../data/market/eurusd/candles.json"
yb_mode = "off"

[candidate.defaults]
policy_params = []
pool = { mid_fee = 0.0003, out_fee = 0.0003 }

[candidate.axes]
"pool.A" = { start = 1, stop = 200, count = 8, multiply = 10000 }
"pool.donation_apy" = { start = 0, stop = 0.10, count = 8 }
"pool.reserved_profit_fraction" = { start = 0, stop = 1, count = 8 }
