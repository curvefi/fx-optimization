[grid]
id = "chfusd-8x8x8"
pair_id = "chfusd"
tags = ["production", "native-pool", "fx", "8x8x8"]

[grid.static_overrides]
"run.metric_projection" = "summary"

# 8x8x8 grid (512 points) over primary axes: A x donation_apy x mid_fee_bps
# with baseline reserved_profit_fraction (10%) and user_swap_size_frac (2%).
[[grid.axes]]
name = "A"
target = { path = "pool.A", scale = 10000, kind = "integer" }
values = [10, 14.7189, 23.8626, 35.1231, 56.9425, 76.0927, 135.8799, 200]

[[grid.axes]]
name = "donation_apy"
target = { path = "pool.donation_apy", kind = "decimal" }
values = [
  0.0,
  0.012903225806451613,
  0.02903225806451613,
  0.041935483870967745,
  0.05806451612903226,
  0.07096774193548387,
  0.08709677419354839,
  0.1,
]

[[grid.axes]]
name = "mid_fee_bps"
targets = [
  { path = "pool.mid_fee", display_scale = 10000, kind = "decimal" },
  { path = "pool.out_fee", display_scale = 10000, kind = "decimal" },
]
values = [1, 2.16129, 3.612903, 4.774194, 6.225806, 7.387097, 8.83871, 10]

[[grid.axes]]
name = "reserved_profit_fraction"
target = { path = "pool.reserved_profit_fraction", kind = "decimal" }
values = [0.1]

[[grid.axes]]
name = "user_swap_size_frac"
target = { path = "pool.user_swap_size_frac", kind = "decimal" }
values = [0.02]
