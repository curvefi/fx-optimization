[optimization]
id = "smoke-chfusd"
pair_id = "chfusd"
policy_id = "native_policy_dual_ema_stale_cap_v1"
algorithm = "tmrbcd"
scenarios = ["chfusd-smoke"]

[optimization.optimizer_config]
budget = 8
batch_size = 4
seed = 42

[optimization.scoring_config]
score_key = "score_fx_lp_e15_slippage_v1"
require_yb = false

# Names, dense ordering, defaults, outer bounds, and quanta come from the
# PolicySpec. This table only narrows the two weights used by the smoke run;
# omitted policy parameters stay fixed at their declared defaults.
[optimization.parameter_space]
fast_half_life_s = { min = 1800.0, max = 7200.0, step = 10.0 }
kappa = { min = 0.5, max = 1.5, step = 0.05 }
