[optimization]
id = "example-pool-dims"
pair_id = "chfusd"
policy_id = "native_policy_dual_ema_stale_cap_v1"
algorithm = "nevergrad_two_points_de"
scenarios = ["chfusd-smoke"]

[optimization.optimizer_config]
budget = 16
batch_size = 4
seed = 42

[optimization.scoring_config]
score_key = "score_fx_lp_e15_slippage_v1"
require_yb = false

# The selected evaluator schema is the authority for canonical dimensions.
# Policy, pool, and numeric run/session dimensions compile through one
# CandidateCompiler before grouped SessionGroup execution.
#
# Pool defaults come from the scenario template; run.n_candles defaults come
# from chfusd-smoke. Bounds and steps below narrow those schema dimensions.
#
# out_fee is a pool dimension in fraction units. kappa is a policy dimension;
# both are emitted through the selected schema rather than legacy aliases.
[optimization.parameter_space]
"pool.out_fee" = { min = 0.001, max = 0.005, step = 0.0005 }
"policy.kappa" = { min = 0.5, max = 1.5, step = 0.05 }
"run.n_candles" = { min = 10070, max = 10080, step = 10 }
