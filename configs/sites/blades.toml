# Remote cluster blades site profile for curve-fx-optimization
schema_version = "site_profile_v2"
name = "blades"
site_type = "ssh"
description = "Remote shared-NFS Ice Lake blade cluster"

[ssh]
user = "heswithme"
key = "~/.ssh/id_rsa2"
port = 22
connect_timeout = 10
options = [
    "-o", "StrictHostKeyChecking=accept-new",
    "-o", "BatchMode=yes",
    "-o", "ConnectTimeout=10",
]

[cluster]
coordinator = "blade-b6"
transport = "shared_nfs"
remote_base = "/home/heswithme/arb/curve-fx-optimization"
remote_run_root = "/home/heswithme/arb/curve-fx-optimization/runs"
repository_root = "/home/heswithme/arb/curve-fx-optimization"
worker_command = "/home/heswithme/arb/bin/fxsim-worker"
logical_cores_per_blade = 128
nix_packages = ["gcc", "cmake", "boost", "gnumake"]
compiler_flags = [
    "-march=icelake-server",
    "-O3",
    "-fno-math-errno",
    "-funroll-loops",
    "-flto",
    "-pipe",
]

blades = [
    "blade-b1",
    "blade-b2",
    "blade-b3",
    "blade-b4",
    "blade-b5",
    "blade-b6",
    "blade-b7",
    "blade-b8",
    "blade-c1",
    "blade-c2",
    "blade-c3",
    "blade-c4",
    "blade-c5",
    "blade-c6",
    "blade-c7",
    "blade-c8",
    "blade-d1",
    "blade-d2",
]

[harness]
binary_name = "arb_evaluator_ld"
remote_binary_path = "/home/heswithme/arb/bin/arb_evaluator_ld"
default_real = "longdouble"
timeout_seconds = 7200
persistent_evaluator = true
chunk_size = 2048

[runner]
max_workers = 18
worker_concurrency = 1
