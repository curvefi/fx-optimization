# Local execution site profile for curve-fx-optimization
schema_version = "site_profile_v1"
name = "local"
site_type = "local"
description = "Local workstation execution using subprocess workers"

# One evaluator process per run: the harness WorkerPool already saturates all
# cores in-process (one scenario load, deterministic chunk partitioning).
# Spawning N processes multiplies the scenario memory N-fold and oversubscribes
# the machine with N parallel pools, so the worker count stays 1.
[runner]
type = "subprocess"
max_workers = 1
worker_concurrency = 1

[harness]
binary_name = "arb_evaluator_ld"
default_real = "longdouble"
timeout_seconds = 3600

[staging]
local_scratch = "runs"
clean_scratch_on_success = false
